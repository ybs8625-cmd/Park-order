name: Save Order to CSV

on:
  repository_dispatch:
    types: [park-order-submit]

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Append order rows to CSV and commit
        env:
          ORDER_JSON: ${{ toJson(github.event.client_payload.order) }}
        run: |
          python <<'PY'
          import csv, json, os
          from pathlib import Path

          HEADERS = [
              "주문번호", "주문시간", "상태", "이름", "연락처", "주소", "메모",
              "품목", "색상", "사이즈", "수량", "단가", "금액", "상품합계", "배송비", "결제합계",
          ]

          raw = os.environ.get("ORDER_JSON") or ""
          if not raw or raw == "null":
              raise SystemExit("주문 데이터가 없습니다.")

          order = json.loads(raw)
          if not isinstance(order, dict) or "주문번호" not in order:
              raise SystemExit("주문 형식이 올바르지 않습니다.")

          path = Path("data/orders.csv")
          path.parent.mkdir(parents=True, exist_ok=True)
          order_id = str(order.get("주문번호") or "")
          customer = order.get("주문자") or {}
          lines = order.get("주문내용") or []

          existing_ids = set()
          file_exists = path.exists() and path.stat().st_size > 0
          if file_exists:
              with path.open("r", encoding="utf-8-sig", newline="") as f:
                  for row in csv.DictReader(f):
                      oid = (row.get("주문번호") or "").strip()
                      if oid:
                          existing_ids.add(oid)

          if order_id and order_id in existing_ids:
              print(f"이미 저장된 주문번호입니다: {order_id}")
          else:
              rows = []
              for line in lines:
                  rows.append({
                      "주문번호": order.get("주문번호", ""),
                      "주문시간": order.get("주문시간", ""),
                      "상태": order.get("상태", ""),
                      "이름": customer.get("이름", ""),
                      "연락처": customer.get("연락처", ""),
                      "주소": customer.get("주소", ""),
                      "메모": customer.get("메모", ""),
                      "품목": line.get("품목", ""),
                      "색상": line.get("색상", ""),
                      "사이즈": line.get("사이즈", ""),
                      "수량": line.get("수량", ""),
                      "단가": line.get("단가", ""),
                      "금액": line.get("금액", ""),
                      "상품합계": order.get("상품합계", ""),
                      "배송비": order.get("배송비", ""),
                      "결제합계": order.get("결제합계", ""),
                  })
              with path.open("a", encoding="utf-8-sig", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=HEADERS)
                  if not file_exists:
                      writer.writeheader()
                  writer.writerows(rows)
              print(f"CSV 추가 완료: {order_id} ({len(rows)}행)")
          PY

      - name: Commit CSV
        run: |
          git config user.name "park-order-bot"
          git config user.email "park-order-bot@users.noreply.github.com"
          git add data/orders.csv
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "Append park order to CSV"
          git push
